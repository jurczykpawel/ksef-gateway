version: 2
# Noise control: one PR per ecosystem and update kind. Everything except majors (patch,
# minor, Docker digests, submodule) is auto-merged once CI is green
# (dependabot-auto-merge.yml); a failed CI pings the owner on the PR, and majors stay
# individual PRs for review. Docker digest bumps of one base image across all
# Dockerfiles arrive as one PR, and base-image majors are ignored (the runtime/LTS lines
# are pinned deliberately and bumped by hand).
updates:
  - package-ecosystem: nuget
    directories:
      - /src/KSeFGateway.Api
      - /src/KSeFGateway.Api.Tests
      - /tools/CertGenerator
      - /tools/InvoiceDemo
      - /tools/TokenGenerator
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      compatible-patches:
        update-types: [patch]
      compatible-minors:
        update-types: [minor]
  - package-ecosystem: npm
    directory: /pdf-service
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      compatible-patches:
        update-types: [patch]
      compatible-minors:
        update-types: [minor]
  - package-ecosystem: npm
    directory: /landing
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      compatible-patches:
        update-types: [patch]
      compatible-minors:
        update-types: [minor]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      compatible-patches:
        update-types: [patch]
      compatible-minors:
        update-types: [minor]
  - package-ecosystem: docker
    directories:
      - /src/KSeFGateway.Api
      - /pdf-service
      - /tools/CertGenerator
      - /tools/InvoiceDemo
      - /tools/TokenGenerator
      - /deploy/aws
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      base-images:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
