version: 2
updates:
- package-ecosystem: nuget
  directories:
  - /src/KSeFGateway.Api
  - /src/KSeFGateway.Api.Tests
  - /tools/CertGenerator
  - /tools/InvoiceDemo
  - /tools/TokenGenerator
  schedule:
    interval: monthly
    time: '10:00'
    timezone: Europe/Warsaw
  open-pull-requests-limit: 1
  cooldown:
    default-days: 14
  allow:
  - dependency-name: '*'
    update-types:
    - version-update:semver-patch
    - version-update:semver-minor
  groups:
    maintenance:
      patterns:
      - '*'
    security:
      applies-to: security-updates
      patterns:
      - '*'
- package-ecosystem: npm
  schedule:
    interval: monthly
    time: '10:00'
    timezone: Europe/Warsaw
  open-pull-requests-limit: 1
  cooldown:
    default-days: 14
  allow:
  - dependency-name: '*'
    update-types:
    - version-update:semver-patch
    - version-update:semver-minor
  groups:
    maintenance:
      patterns:
      - '*'
    security:
      applies-to: security-updates
      patterns:
      - '*'
  directories:
  - /pdf-service
  - /landing
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: quarterly
    time: '10:00'
    timezone: Europe/Warsaw
  open-pull-requests-limit: 1
  cooldown:
    default-days: 14
  groups:
    actions:
      patterns:
      - '*'
    security:
      applies-to: security-updates
      patterns:
      - '*'
- package-ecosystem: docker
  directories:
  - /src/KSeFGateway.Api
  - /pdf-service
  - /tools/CertGenerator
  - /tools/InvoiceDemo
  - /tools/TokenGenerator
  - /deploy/aws
  schedule:
    interval: monthly
    time: '10:00'
    timezone: Europe/Warsaw
  open-pull-requests-limit: 1
  cooldown:
    default-days: 14
  groups:
    images:
      patterns:
      - '*'
  ignore:
  - dependency-name: mcr.microsoft.com/dotnet/sdk
    versions:
    - '>=12'
  - dependency-name: node
    versions:
    - '>=27'
  - dependency-name: public.ecr.aws/lambda/dotnet
    versions:
    - '>=11'
  - dependency-name: mcr.microsoft.com/dotnet/aspnet
    versions:
    - '>=12'
- package-ecosystem: gitsubmodule
  directory: /
  schedule:
    interval: monthly
    time: '10:00'
    timezone: Europe/Warsaw
  open-pull-requests-limit: 1
  cooldown:
    default-days: 14
  groups:
    submodules:
      patterns:
      - '*'
