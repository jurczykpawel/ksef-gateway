version: 2
# Noise control: one PR per ecosystem and update kind. Patch updates are grouped and
# auto-merged (dependabot-auto-merge.yml); minor updates are grouped into one PR for
# review; majors stay individual PRs. Docker digest bumps of one base image across all
# Dockerfiles arrive as one PR, and base-image majors are ignored (the runtime/LTS lines
# are pinned deliberately and bumped by hand).
updates:
  - package-ecosystem: nuget
    directories:
      - /src/KSeFGateway.Api
      - /src/KSeFGateway.Api.Tests
      - /tools/CertGenerator
      - /tools/InvoiceDemo
      - /tools/TokenGenerator
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      compatible-patches:
        update-types: [patch]
      compatible-minors:
        update-types: [minor]
  - package-ecosystem: npm
    directory: /pdf-service
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      compatible-patches:
        update-types: [patch]
      compatible-minors:
        update-types: [minor]
  - package-ecosystem: npm
    directory: /landing
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      compatible-patches:
        update-types: [patch]
      compatible-minors:
        update-types: [minor]
    ignore:
      # Muted until Astro supports it: `astro check` (@astrojs/check 0.9.12, latest) refuses
      # TypeScript 7 and `npm ci` fails on its peer range. Revisit when @astrojs/check
      # accepts ^7 or the TS 7.1 + @astrojs/ts-content-mapper path is stable (issue #181).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      compatible-patches:
        update-types: [patch]
      compatible-minors:
        update-types: [minor]
  - package-ecosystem: docker
    directories:
      - /src/KSeFGateway.Api
      - /pdf-service
      - /tools/CertGenerator
      - /tools/InvoiceDemo
      - /tools/TokenGenerator
      - /deploy/aws
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      base-images:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
