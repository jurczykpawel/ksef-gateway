version: 2
updates:
  - package-ecosystem: nuget
    directory: /src/KSeFGateway.Api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      compatible-patches:
        update-types: [patch]
  - package-ecosystem: nuget
    directory: /src/KSeFGateway.Api.Tests
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      compatible-patches:
        update-types: [patch]
  - package-ecosystem: nuget
    directory: /tools/CertGenerator
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      compatible-patches:
        update-types: [patch]
  - package-ecosystem: nuget
    directory: /tools/InvoiceDemo
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      compatible-patches:
        update-types: [patch]
  - package-ecosystem: nuget
    directory: /tools/TokenGenerator
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      compatible-patches:
        update-types: [patch]
  - package-ecosystem: npm
    directory: /pdf-service
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      compatible-patches:
        update-types: [patch]
  - package-ecosystem: npm
    directory: /landing
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      compatible-patches:
        update-types: [patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      compatible-patches:
        update-types: [patch]

  # Majors (and minors) stay in individual PRs; only patches are grouped above.
  - package-ecosystem: docker
    directories:
      - /src/KSeFGateway.Api
      - /pdf-service
      - /tools/CertGenerator
      - /tools/InvoiceDemo
      - /tools/TokenGenerator
      - /deploy/aws
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      compatible-patches:
        update-types: [patch]

  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
