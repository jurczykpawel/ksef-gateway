name: Build and Push Docker Images

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
    tags:
      - 'v*'

permissions:
  contents: read

# Serialize publications of the same ref so tag aliases and signatures stay together.
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  # A local reusable workflow checks the exact same ref, including v* release tags.
  ci:
    uses: ./.github/workflows/ci.yml

  build-api:
    needs: ci
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    name: Build API image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/jurczykpawel/ksef-gateway-api
          # Publish candidates first; release/branch aliases are promoted only after smoke.
          tags: |
            type=raw,value=candidate-${{ github.sha }}

      - name: Build and push API image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: src/KSeFGateway.Api/Dockerfile
          push: true
          # mode=min: the attestation never records build arguments
          provenance: mode=min
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-pdf:
    needs: ci
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    name: Build PDF service image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/jurczykpawel/ksef-gateway-pdf
          tags: |
            type=raw,value=candidate-${{ github.sha }}

      - name: Build and push PDF service image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: pdf-service/
          file: pdf-service/Dockerfile
          push: true
          # mode=min: the attestation never records build arguments
          provenance: mode=min
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke-image:
    name: Smoke published image digests (one TEST invoice)
    needs: [build-api, build-pdf]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Start published digests in TEST
        env:
          API_DIGEST: ${{ needs.build-api.outputs.digest }}
          PDF_DIGEST: ${{ needs.build-pdf.outputs.digest }}
          KSEF_TOKEN: ${{ secrets.KSEF_TOKEN }}
          KSEF_NIP: ${{ secrets.KSEF_NIP }}
        run: |
          test -n "$KSEF_TOKEN" && test -n "$KSEF_NIP"
          docker network create regression
          docker run -d --name smoke-pdf --network regression -e KSEF_ENV=TEST "${REGISTRY}/jurczykpawel/ksef-gateway-pdf@${PDF_DIGEST}"
          docker run -d --name smoke-api --network regression -p 127.0.0.1:8080:8080 \
            -e KSEF_ENV=TEST -e KSEF_TOKEN -e KSEF_NIP -e GATEWAY_API_KEY=smoke-key \
            -e PDF_SERVICE_URL=http://smoke-pdf:3000 "${REGISTRY}/jurczykpawel/ksef-gateway-api@${API_DIGEST}"
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:8080/health > /dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Health, authenticated status, one send, PDF signature
        env:
          KSEF_NIP: ${{ secrets.KSEF_NIP }}
          GATEWAY_API_KEY: smoke-key
          GATEWAY_URL: http://localhost:8080
        run: |
          dotnet restore src/KSeFGateway.Api.Tests/KSeFGateway.Api.Tests.csproj --configfile src/nuget.config
          dotnet test src/KSeFGateway.Api.Tests/KSeFGateway.Api.Tests.csproj -c Release --no-restore --filter FullyQualifiedName~PublishedImage_HealthStatusSendAndPdf
      - name: Clean up
        if: always()
        run: |
          docker rm -f smoke-api smoke-pdf || true
          docker network rm regression || true

  promote:
    name: Promote tested image digests to release aliases
    needs: [build-api, build-pdf, smoke-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: api-meta
        with:
          images: ghcr.io/jurczykpawel/ksef-gateway-api
          tags: |
            type=ref,event=branch
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: pdf-meta
        with:
          images: ghcr.io/jurczykpawel/ksef-gateway-pdf
          tags: |
            type=ref,event=branch
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: Promote immutable tested digests
        env:
          API_DIGEST: ${{ needs.build-api.outputs.digest }}
          PDF_DIGEST: ${{ needs.build-pdf.outputs.digest }}
          API_TAGS: ${{ steps.api-meta.outputs.tags }}
          PDF_TAGS: ${{ steps.pdf-meta.outputs.tags }}
        run: |
          for component in api pdf; do
            if [ "$component" = api ]; then digest="$API_DIGEST"; tags="$API_TAGS"; else digest="$PDF_DIGEST"; tags="$PDF_TAGS"; fi
            while IFS= read -r tag; do
              [ -n "$tag" ] || continue
              docker buildx imagetools create --prefer-index=false --tag "$tag" "${REGISTRY}/jurczykpawel/ksef-gateway-${component}@${digest}"
            done <<< "$tags"
          done

  sign:
    name: Sign digests and export SBOMs
    needs: [build-api, build-pdf, smoke-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign and verify immutable image references
        env:
          API_DIGEST: ${{ needs.build-api.outputs.digest }}
          PDF_DIGEST: ${{ needs.build-pdf.outputs.digest }}
          CERTIFICATE_IDENTITY: https://github.com/${{ github.workflow_ref }}
        run: |
          mkdir sbom
          for component in api pdf; do
            if [ "$component" = api ]; then digest="$API_DIGEST"; else digest="$PDF_DIGEST"; fi
            image="${REGISTRY}/jurczykpawel/ksef-gateway-${component}@${digest}"
            cosign sign --yes "$image"
            cosign verify "$image"               --certificate-identity "$CERTIFICATE_IDENTITY"               --certificate-oidc-issuer https://token.actions.githubusercontent.com
            docker buildx imagetools inspect "$image" --format '{{ json .SBOM.SPDX }}' > "sbom/${component}.spdx.json"
            jq -e '.spdxVersion and (.packages | length > 0)' "sbom/${component}.spdx.json"
            echo "$image" >> sbom/image-digests.txt
          done

      - name: Preserve SBOMs and image digests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-sboms
          path: sbom/
          if-no-files-found: error

  release-sboms:
    name: Attach SBOMs to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [sign, promote]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download SBOMs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-sboms
          path: sbom/

      - name: Attach to existing release or prepare a draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --draft --title "$TAG" --notes "Container SBOMs and signed image digests."
          fi
          gh release upload "$TAG" sbom/* --clobber

  # Roll the release out to the production services on Render. Production services are
  # image-backed with the image URL `...:latest`, and `promote` above moves `latest` only
  # for release tags, after the smoke test. A deploy hook (no imgURL) makes Render pull the
  # current `latest`; a manual redeploy or an env change in Render pulls the same image, so
  # production can never silently fall back to an older release. Render keeps the previous
  # instance serving when the new one fails its health check, so there is no rollback logic
  # here. Skipped for pre-release tags (v1.0.0-rc.1).
  deploy-prod:
    name: Deploy release to production (Render)
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    needs: [sign, promote, release-sboms]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Trigger deploys (PDF first, then API) and wait for liveness
        env:
          HOOK_PDF: ${{ secrets.RENDER_HOOK_PDF }}
          HOOK_API: ${{ secrets.RENDER_HOOK_API }}
          HEALTH_URL: ${{ vars.PROD_HEALTH_URL }}
        run: |
          set -euo pipefail
          [ -n "$HOOK_PDF" ] && [ -n "$HOOK_API" ] || { echo "::error::RENDER_HOOK_PDF / RENDER_HOOK_API are not configured"; exit 1; }
          trigger() {
            local code
            echo "::add-mask::$1"
            code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$1")
            echo "$2 deploy hook -> HTTP $code"
            [ "$code" -ge 200 ] && [ "$code" -lt 300 ] || { echo "::error::$2 deploy hook failed"; exit 1; }
          }
          trigger "$HOOK_PDF" pdf
          trigger "$HOOK_API" api
          # Liveness only: /health does not report a version, so this proves the service is
          # up after the rollout, not which release serves. Up to 10 minutes (free-plan cold start).
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$HEALTH_URL" || true)
            [ "$code" = 200 ] && { echo "production /health is 200 after ~$((i*10))s"; exit 0; }
            sleep 10
          done
          echo "::error::production /health did not return 200 within 10 minutes"; exit 1
