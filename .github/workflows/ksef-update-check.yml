name: KSeF Update Check

on:
  schedule:
    - cron: '0 9 * * 1'  # every Monday at 9:00 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/ksef-update-check.yml'
      - '.github/ksef_update_check.py'
      - '.github/test_ksef_update_check.py'
      - '.github/ksef-versions.json'

permissions:
  contents: read

# Serialize notifications and state commits, including manual runs.
concurrency:
  group: ksef-update-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: python3 -m unittest discover -s .github -p 'test_ksef_update_check.py' -v

  check-updates:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Persist the last successfully notified snapshot.
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Observe upstream and notify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/ksef_update_check.py

      - name: Save last notified observations
        run: |
          if git diff --quiet .github/ksef-versions.json; then
            echo "No notification state changes to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .github/ksef-versions.json
            git commit -m "Record last notified KSeF upstream observations [skip ci]"
            git push
          fi
