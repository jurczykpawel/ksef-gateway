name: Nightly regression

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

# A manual run must not overlap the scheduled run.
concurrency:
  group: regression-nightly
  cancel-in-progress: false

jobs:
  regression:
    uses: ./.github/workflows/ci.yml
    with:
      nightly: true
