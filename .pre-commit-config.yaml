repos:
  - repo: https://github.com/trufflesecurity/trufflehog
    rev: v3.88.24
    hooks:
      - id: trufflehog
        name: TruffleHog secret scan
        entry: trufflehog git file://. --since-commit HEAD --results verified,unknown --fail
        language: golang
        pass_filenames: false
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: pdf-typecheck
        name: PDF service typecheck
        entry: bash -c 'cd pdf-service && OUT=$(npx tsc --noEmit --project tsconfig.json 2>&1 | grep -v "lib/" | grep -v "TS6059"); echo "$OUT"; ! echo "$OUT" | grep -q "error TS"'
        language: system
        pass_filenames: false
        files: ^pdf-service/src/

      - id: pdf-test
        name: PDF service tests
        entry: bash -c 'cd pdf-service && npm test'
        language: system
        pass_filenames: false
        files: ^pdf-service/

      # .NET build + unit tests run in Docker (the same `ksef-api-tests` image CI uses), so the hook
      # needs no local SDK, no pre-restored packages and no matching runtime version.
      - id: dotnet-tests
        name: .NET build + unit tests (Docker)
        entry: bash -c 'docker info >/dev/null 2>&1 || { echo "Docker not running - skipping .NET tests"; exit 0; }; [ -f .env ] || { echo ".env missing - skipping .NET tests"; exit 0; }; docker compose --env-file .env --profile tools run --rm --build ksef-api-tests'
        language: system
        pass_filenames: false
        files: ^src/.*\.cs$

      - id: integration-tests
        name: Integration tests (unit + E2E vs live gateway)
        entry: bash -c 'scripts/test-full.sh'
        language: system
        pass_filenames: false
        stages: [pre-push]
